<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Family Portal{% endblock %} | Pojulu Heritage Foundation</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root {
  --g9: #1B5E20; --g7: #2E7D32; --g5: #43A047; --g4: #66BB6A;
  --g1: #E8F5E9; --g0: #F4FBF4;
  --white: #fff; --text: #1A2E1A; --mid: #3A5A3A; --light: #6B8F6B;
  --border: #C8E6C9;
  --font: 'DM Sans', sans-serif; --font-d: 'Cormorant Garamond', serif;
  --shadow: 0 2px 16px rgba(27,94,32,.10);
}
* { box-sizing: border-box; }
body { font-family: var(--font); background: #F0F4F1; color: var(--text); min-height: 100vh; margin: 0; }
.fam-topbar {
  background: var(--g9); padding: 16px 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.fam-topbar-title { font-family: var(--font-d); font-size: 1.2rem; font-weight: 700; color: white; }
.fam-topbar-sub { font-size: .68rem; color: var(--g4); letter-spacing: .1em; text-transform: uppercase; }
.fam-logout { background: none; border: none; color: rgba(255,255,255,.7); font-size: .82rem; cursor: pointer; }
.fam-logout:hover { color: white; }
.fam-content { max-width: 760px; margin: 0 auto; padding: 40px 24px; }
.fam-card { background: var(--white); border-radius: 10px; padding: 32px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px; }
.fam-card-title { font-family: var(--font-d); font-size: 1.3rem; font-weight: 700; color: var(--g7); margin-bottom: 6px; }
.fam-card-sub { font-size: .85rem; color: var(--light); margin-bottom: 20px; }
.fam-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; border-radius: 6px; font-size: .84rem; font-weight: 600;
  cursor: pointer; border: none; transition: all .18s; text-decoration: none;
}
.fam-btn-primary { background: var(--g7); color: white; }
.fam-btn-primary:hover { background: var(--g9); color: white; }
.fam-btn-outline { background: transparent; color: var(--g7); border: 1.5px solid var(--g7); }
.fam-btn-outline:hover { background: var(--g7); color: white; }
.fam-badge { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 100px; }
.fam-badge-green { background: var(--g1); color: var(--g7); }
.fam-badge-grey { background: #F5F5F5; color: #616161; }
.fam-label { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mid); margin-bottom: 5px; display: block; }
</style>
</head>
<body>
<div class="fam-topbar">
  <div>
    <div class="fam-topbar-title">Pojulu Heritage Foundation</div>
    <div class="fam-topbar-sub">Family Portal</div>
  </div>
  {% if request.user.is_authenticated %}
  <form method="post" action="{% url 'wills:logout' %}">
    {% csrf_token %}
    <button type="submit" class="fam-logout"><i class="bi bi-box-arrow-right me-1"></i>Log out</button>
  </form>
  {% endif %}
</div>
<div class="fam-content">
  {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }} py-2 mb-3" style="font-size:.85rem">{{ msg }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>

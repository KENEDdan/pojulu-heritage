services:
  web:
    build: .
    container_name: pojulu_heritage_web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - media_data:/app/media
      - staticfiles_data:/app/staticfiles
    ports:
      - "8005:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: pojulu_heritage_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pojulu_heritage}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pojulu_heritage}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
  staticfiles_data:
